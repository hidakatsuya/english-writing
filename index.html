<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple editor for writing in English while keeping track of your word count.">
    <link rel="canonical" href="https://hidakatsuya.dev/english-writing/">
    <meta property="og:title" content="English Writing">
    <meta property="og:description" content="A simple editor for writing in English while keeping track of your word count.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hidakatsuya.dev/english-writing/">
    <meta property="og:site_name" content="English Writing">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="English Writing">
    <meta name="twitter:description" content="A simple editor for writing in English while keeping track of your word count.">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-title" content="English Writing">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>English Writing</title>
    <style>
      :root {
        color-scheme: light dark;
        --page-background: #ffffff;
        --surface: #ffffff;
        --text: #202124;
        --muted-text: #5b5c58;
        --border: #bfc0bb;
        --primary: #202124;
        --primary-hover: #3a3b3e;
        --primary-text: #ffffff;
        --focus: #5c6ac4;
        --editor-focus: #7d7e79;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page-background: #191918;
          --surface: #242422;
          --text: #f2f2ef;
          --muted-text: #b8b8b1;
          --border: #5c5c57;
          --primary: #f2f2ef;
          --primary-hover: #d9d9d4;
          --primary-text: #20201e;
          --focus: #9ba5e8;
          --editor-focus: #85857f;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--page-background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 40px, 820px);
        margin: 0 auto;
        padding: 48px 0;
      }

      .editor-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 12px;
      }

      .description {
        margin: 0;
        color: var(--muted-text);
        font-size: 14px;
        line-height: 1.5;
      }

      .word-count {
        flex: 0 0 auto;
        margin: 0;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .word-count-value {
        font-size: 28px;
        font-weight: 500;
        line-height: 1;
      }

      .word-count-unit {
        color: var(--muted-text);
        font-size: 13px;
      }

      .editor-surface {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
      }

      .editor-surface:focus-within {
        border-color: var(--editor-focus);
      }

      textarea {
        display: block;
        width: 100%;
        min-height: clamp(360px, 62vh, 640px);
        resize: vertical;
        border: 0;
        border-radius: 0;
        outline: none;
        padding: 24px;
        background: transparent;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        line-height: 1.7;
      }

      textarea::placeholder {
        color: var(--muted-text);
        opacity: 0.78;
      }

      .editor-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 14px;
      }

      .privacy-note {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 0;
        color: var(--muted-text);
        font-size: 12px;
        line-height: 1.5;
      }

      .source-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: inherit;
        text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
        text-underline-offset: 2px;
      }

      .source-link:hover {
        color: var(--text);
        text-decoration-color: currentColor;
      }

      .source-link:focus-visible {
        border-radius: 3px;
        outline: 3px solid color-mix(in srgb, var(--focus) 40%, transparent);
        outline-offset: 2px;
      }

      .source-link picture {
        display: contents;
      }

      .github-icon {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
      }

      .editor-actions {
        display: flex;
        gap: 8px;
      }

      .copy-button,
      .clear-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      .copy-button {
        gap: 8px;
        min-width: 112px;
        border: 1px solid transparent;
        background: var(--primary);
        color: var(--primary-text);
      }

      .clear-button {
        min-width: 96px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }

      .copy-button:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      .clear-button:hover:not(:disabled) {
        background: color-mix(in srgb, var(--text) 7%, transparent);
      }

      .copy-button:focus-visible,
      .clear-button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--focus) 40%, transparent);
        outline-offset: 2px;
      }

      .copy-button:disabled {
        border-color: #e5e5e2;
        background: #e5e5e2;
        color: #92928d;
        cursor: not-allowed;
      }

      .clear-button:disabled {
        border-color: #d9d9d5;
        color: #94948f;
        cursor: not-allowed;
      }

      @media (prefers-color-scheme: dark) {
        .copy-button:disabled {
          border-color: #484844;
          background: #3b3b38;
          color: #85857f;
        }

        .clear-button:disabled {
          border-color: #484844;
          color: #85857f;
        }
      }

      .copy-icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .copy-status {
        min-height: 1.5em;
        margin: 8px 0 0;
        color: var(--muted-text);
        font-size: 12px;
        text-align: right;
      }

      @media (max-width: 520px) {
        main {
          width: calc(100% - 28px);
          padding: 28px 0;
        }

        .editor-toolbar {
          gap: 16px;
        }

        .word-count-value {
          font-size: 24px;
        }

        textarea {
          min-height: 55vh;
          padding: 18px;
          font-size: 17px;
        }

        .editor-footer {
          align-items: stretch;
          flex-direction: column-reverse;
          gap: 10px;
        }

        .privacy-note,
        .copy-status {
          text-align: center;
        }

        .privacy-note {
          justify-content: center;
        }

        .editor-actions {
          display: flex;
          width: 100%;
        }

        .copy-button,
        .clear-button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="editor-toolbar">
        <p class="description">Write in English and keep track of your word count.</p>
        <p class="word-count" aria-live="polite" aria-atomic="true">
          <span class="word-count-value" id="word-count">0</span>
          <span class="word-count-unit">words</span>
        </p>
      </div>

      <div class="editor-surface">
        <textarea id="editor" aria-label="English text" placeholder="Start writing…" spellcheck="true"></textarea>
      </div>

      <div class="editor-footer">
        <p class="privacy-note">
          <span>Nothing you type is sent anywhere.</span>
          <a
            class="source-link"
            href="https://github.com/hidakatsuya/english-writing"
            aria-label="View source code on GitHub (opens in a new tab)"
            target="_blank"
            rel="noopener noreferrer"
          >
            <picture>
              <source srcset="icons/github-mark-16-white.svg" media="(prefers-color-scheme: dark)">
              <img class="github-icon" src="icons/github-mark-16.svg" alt="" width="16" height="16">
            </picture>
            <span>View source</span>
          </a>
        </p>
        <div class="editor-actions">
          <button class="clear-button" id="clear-button" type="button" disabled>
            <span id="clear-button-label">Clear</span>
          </button>
          <button class="copy-button" id="copy-button" type="button" disabled>
            <svg class="copy-icon" aria-hidden="true" viewBox="0 0 24 24">
              <rect width="14" height="14" x="8" y="8" rx="2"></rect>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
            </svg>
            <span id="copy-button-label">Copy</span>
          </button>
        </div>
      </div>
      <p class="copy-status" id="copy-status" aria-live="polite"></p>
    </main>

    <script>
      (() => {
        const editor = document.getElementById("editor");
        const wordCount = document.getElementById("word-count");
        const clearButton = document.getElementById("clear-button");
        const clearButtonLabel = document.getElementById("clear-button-label");
        const copyButton = document.getElementById("copy-button");
        const copyButtonLabel = document.getElementById("copy-button-label");
        const copyStatus = document.getElementById("copy-status");
        const wordPattern = /[A-Za-z0-9]+(?:['’\-‐‑][A-Za-z0-9]+)*/g;
        let statusTimer;
        let clearTimer;
        let clearPending = false;

        const countWords = (text) => text.match(wordPattern)?.length ?? 0;

        const resetClearConfirmation = () => {
          window.clearTimeout(clearTimer);
          clearPending = false;
          clearButtonLabel.textContent = "Clear";
        };

        const updateEditorState = () => {
          const isEmpty = editor.value.length === 0;
          wordCount.textContent = String(countWords(editor.value));
          clearButton.disabled = isEmpty;
          copyButton.disabled = isEmpty;
          copyStatus.textContent = "";
          resetClearConfirmation();
        };

        const showCopyStatus = (message, buttonLabel = "Copy") => {
          window.clearTimeout(statusTimer);
          copyButtonLabel.textContent = buttonLabel;
          copyStatus.textContent = message;
          statusTimer = window.setTimeout(() => {
            copyButtonLabel.textContent = "Copy";
            copyStatus.textContent = "";
          }, 1800);
        };

        const copyWithSelection = () => {
          editor.focus();
          editor.select();
          showCopyStatus("Text selected. Use your browser's copy command.", "Selected");
        };

        editor.addEventListener("input", updateEditorState);

        clearButton.addEventListener("click", () => {
          if (!clearPending) {
            clearPending = true;
            clearButtonLabel.textContent = "Clear all?";
            clearTimer = window.setTimeout(resetClearConfirmation, 3000);
            return;
          }

          resetClearConfirmation();
          editor.value = "";
          updateEditorState();
          editor.focus();
          copyStatus.textContent = "Text cleared.";
          window.clearTimeout(statusTimer);
          statusTimer = window.setTimeout(() => {
            copyStatus.textContent = "";
          }, 1800);
        });

        copyButton.addEventListener("click", async () => {
          try {
            if (!navigator.clipboard?.writeText) {
              copyWithSelection();
              return;
            }

            await navigator.clipboard.writeText(editor.value);
            showCopyStatus("Copied to clipboard.", "Copied");
          } catch {
            copyWithSelection();
          }
        });

        updateEditorState();

        if ("serviceWorker" in navigator && window.location.protocol !== "file:") {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("./service-worker.js").catch(() => {});
          });
        }
      })();
    </script>
  </body>
</html>
